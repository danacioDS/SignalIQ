services:
  - type: web
    name: signaliq-api
    runtime: python
    repo: https://github.com/danacioDS/SignalIQ
    branch: main
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      python -m app.main
    envVars:
      - key: TWELVE_DATA_API_KEY
        value: ***REMOVED***
      - key: ALPHA_VANTAGE_API_KEY
        value: OHKJN60EB6YJYO5L
      - key: LOG_FORMAT
        value: text
      - key: PYTHON_VERSION
        value: 3.12.5
