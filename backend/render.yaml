services:
  - type: web
    name: signaliq-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signaliq_db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://signaliq-zeta.vercel.app,https://signaliq-zeta-ten.vercel.app
      - key: FINNHUB_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GROQ_API_KEY
        sync: false
